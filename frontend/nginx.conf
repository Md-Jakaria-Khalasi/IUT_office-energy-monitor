server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;

    # SPA-friendly routing: serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets emitted by Flutter web
    location ~* \.(?:js|css|wasm|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Don't cache the entry HTML so updates roll out immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}